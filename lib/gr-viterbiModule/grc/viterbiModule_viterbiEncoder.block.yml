id: viterbiModule_viterbiEncoder
label: viterbiEncoder
category: '[viterbiModule]'

templates:
  imports: from gnuradio import viterbiModule
  make: viterbiModule.viterbiEncoder(${add_noise}, ${noise_amt})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: add_noise
  label: Add Noise
  dtype: bool
  default: 'False'
- id: noise_amt
  label: Bit Flip Probability
  dtype: float
  default: 0.05

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: message
#  dtype: ...
#  vlen: ...
#  optional: ...

outputs:
- label: out
  domain: message
#  dtype: ...
#  vlen: ...
#  optional: ...

documentation: |-
  Rate-1/2 K-4 convolutional encoder.
  Input: PDU of unpacked payload bits, whole bytes only, up to 240 bytes.
  Output: PDU of encoded bits, including header and 3 tail zeros.
  Add Noise allows random flipping of bits with probability given by the associated parameter.

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
