id: variable_ieee802_15_4_variable_encoder
label: IEEE 802.15.4 Variable Size Encoder Definition
flags: [show_id]

parameters:
  - id: preamble
    label: Preamble
    dtype: int
    default: "0x55"

  - id: preamble_len
    label: Preamble Length
    dtype: int
    default: 4

  - id: sync_word
    label: Synchronization Word
    dtype: raw
    default: [0x31, 0xe5]

  - id: length_field_bytes
    label: Length field bytes
    dtype: int
    default: "1"
    options: ["1", "2", "4"]
    option_labels: ["1", "2", "4"]

# Happy hacky times again...
value: ${ str(id) }

templates:
  imports: import gnuradio.uniclogs as uniclogs
  var_make: |-
    self.${id} = ${id} = uniclogs.ieee802_15_4_encoder.make(${preamble}, ${preamble_len}, ${length_field_bytes}, ${sync_word} )

file_format: 1
