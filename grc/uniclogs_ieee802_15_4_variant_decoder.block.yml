id: uniclogs_ieee802_15_4_variant_decoder
label: IEEE 802.15.4 Variable Decoder Definition w/ FEC
category: '[uniclogs]'
flags: [show_id]

parameters:
  - id: preamble
    label: Preamble
    dtype: raw
    default: [0x55, 0x55, 0x55, 0x55, 0x55]

  - id: preamble_thrsh
    label: Preamble Threshold
    dtype: int
    default: 5

  - id: sync_word
    label: Synchronization Word
    dtype: raw
    default: [0x90, 0x4e]        # SFD0 (this works for rx_fec_recording_3)
    #        [0x6f, 0x4e]        # SFD1 (this works for 20db_pocketbeagle)

  - id: sync_thrsh
    label: Synchronization Word Threshold
    dtype: int
    default: 3

  - id: invert_payload
    label: Invert payload bits
    dtype: bool
    default: true

  - id: length_little_endian
    label: Length field LSB first (little endian)
    dtype: bool
    default: true                  # SFD0 (this works for rx_fec_recording_3)
    #        false                 # SFD1 (this works for 20db_pocketbeagle)

value: ${ str(id) }

templates:
  imports: import gnuradio.uniclogs as uniclogs
  var_make: |-
    self.${id} = ${id} = uniclogs.ieee802_15_4_variant_decoder(${preamble}, ${preamble_thrsh}, ${sync_word}, ${sync_thrsh}, ${invert_payload}, ${length_little_endian})

file_format: 1
