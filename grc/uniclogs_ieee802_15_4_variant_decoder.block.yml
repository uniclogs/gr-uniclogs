id: uniclogs_ieee802_15_4_variant_decoder
label: IEEE 802.15.4 Variable Decoder Definition
category: "[uniclogs]"
flags: [show_id]

parameters:
  - id: preamble
    label: Preamble
    dtype: raw
    default: [0x55, 0x55, 0x55, 0x55, 0x55]

  - id: preamble_thrsh
    label: Preamble Threshold
    dtype: int
    default: 5

  - id: sync_word
    label: Synchronization Word
    dtype: raw
    default: [0x31, 0xe5]

  - id: sync_thrsh
    label: Synchronization Word Threshold
    dtype: int
    default: 3

value: ${ str(id) }

templates:
  imports: import gnuradio.uniclogs as uniclogs
  var_make: |-
    self.${id} = ${id} = uniclogs.ieee802_15_4_variant_decoder(${preamble}, ${preamble_thrsh}, ${sync_word}, ${sync_thrsh})

file_format: 1
